name: CI

# 仅执行验证：本工作流不会申请 AWS 身份，也不会修改云资源。
# dev 环境部署由 deploy-dev.yml 负责。
#
# 两个 Job 相互独立并行执行：
#   - drizzle-check：Schema 与已提交 SQL 必须描述同一数据库结构。
#   - lambda-bundle-check：SAM 产物必须包含全部运行时 chunk。
#
# 固定 Node 与 pnpm 版本，避免本地工具升级后在 CI 中静默改变 migration
# 或 Lambda Bundle。
on:
  pull_request:
  push:
    branches: [main]

# 同一 PR 或分支有新提交时，取消旧的进行中任务。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drizzle-check:
    name: Drizzle migrations in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 与根 package.json 的 packageManager 保持一致。
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          # drizzle-kit 0.31 的 TypeScript 转换需要 Node 20；Node 22 内置的
          # strip-types 无法处理 Schema 中使用的部分语法。
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify schema and committed migrations are in sync
        # check-drizzle.sh 备份 migrations 目录并执行 drizzle-kit generate；
        # 如果将产生新文件则失败。脚本中的 trap 会恢复工作区。
        run: pnpm db:check

  lambda-bundle-check:
    name: Lambda bundle integrity
    # 检查服务端构建产物，防止 Makefile 漏复制 tsdown chunk，导致 Lambda
    # 初始化出现 ERR_MODULE_NOT_FOUND、边缘节点返回 504。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: SAM build
        run: X_GAME_ROOT="$GITHUB_WORKSPACE" sam build

      - name: Verify all tsdown chunks shipped
        # tsdown 会拆分 Bundle，Makefile 必须通过 cp -R 复制完整 dist。
        # 如果退化为只复制 lambda.mjs，Lambda 初始化会失败并使请求返回 504。
        run: |
          set -e
          ARTIFACT=".aws-sam/build/ServerFunction"
          test -f "$ARTIFACT/lambda.mjs" || { echo "✗ lambda.mjs missing"; exit 1; }
          test -d "$ARTIFACT/migrations" || { echo "✗ migrations/ missing"; exit 1; }
          mjs_count=$(find "$ARTIFACT" -maxdepth 1 -name '*.mjs' | wc -l)
          if [ "$mjs_count" -lt 3 ]; then
            echo "✗ only $mjs_count .mjs file(s) in artifact; tsdown chunks are missing"
            ls -la "$ARTIFACT"
            exit 1
          fi
          echo "✓ artifact OK: $mjs_count .mjs files + migrations/"

      - name: Verify no bare npm imports in lambda.mjs
        # 防止 tsdown 留下裸 npm import。Lambda 运行环境没有 node_modules，
        # 产物只是扁平的 .mjs 文件；遗漏内联会导致冷启动模块找不到和 504。
        #
        # 检查会排除 ./ 相对 chunk、node: 内置模块和虚拟模块，同时覆盖
        # re-export 与副作用 import。
        run: |
          set -e
          ARTIFACT=".aws-sam/build/ServerFunction"
          bare=$(grep -nE '^\s*(import|export).*from\s+"([^./]|_[^/])' "$ARTIFACT/lambda.mjs" | grep -v '"node:' || true)
          if [ -n "$bare" ]; then
            echo "✗ lambda.mjs contains bare npm imports that will fail at Lambda runtime:"
            echo "$bare"
            echo ""
            echo "  These must be inlined (see apps/server/src/migrator.ts for an example)"
            echo "  or the package must be added to the bundle's noExternal list."
            exit 1
          fi
          echo "✓ no bare npm imports in lambda.mjs"
