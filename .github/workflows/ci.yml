name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs for the same PR/branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drizzle-check:
    name: Drizzle migrations in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned to match root package.json `packageManager`.
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          # Node 20 — required by drizzle-kit 0.31's TS transform. Node
          # 22's built-in strip-types can't handle `as const` and other
          # syntax used in our schema files.
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify schema and committed migrations are in sync
        # scripts/check-drizzle.sh snapshots the migrations folder, runs
        # `drizzle-kit generate`, and fails if a new file would have
        # been produced. The trap in the script restores the working
        # tree so CI never leaves behind a generated migration file.
        run: pnpm db:check

  lambda-bundle-check:
    name: Lambda bundle integrity
    # Run only when the server or its build config changes. Catches the
    # "Makefile forgot to copy tsdown chunks" regression that produced
    # ERR_MODULE_NOT_FOUND at Lambda init and 504s at the edge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: SAM build
        run: X_GAME_ROOT="$GITHUB_WORKSPACE" sam build

      - name: Verify all tsdown chunks shipped
        # tsdown with `noExternal: /.+/.+` code-splits the bundle
        # (factory-*.mjs, dist-*.mjs, compiled-query-*.mjs, etc.). The
        # Makefile must `cp -R` the whole dist/ folder; if it ever
        # regresses to copying just lambda.mjs, the Lambda init fails
        # with ERR_MODULE_NOT_FOUND and every request 504s.
        run: |
          set -e
          ARTIFACT=".aws-sam/build/ServerFunction"
          test -f "$ARTIFACT/lambda.mjs" || { echo "✗ lambda.mjs missing"; exit 1; }
          test -d "$ARTIFACT/migrations" || { echo "✗ migrations/ missing"; exit 1; }
          mjs_count=$(find "$ARTIFACT" -maxdepth 1 -name '*.mjs' | wc -l)
          if [ "$mjs_count" -lt 3 ]; then
            echo "✗ only $mjs_count .mjs file(s) in artifact; tsdown chunks are missing"
            ls -la "$ARTIFACT"
            exit 1
          fi
          echo "✓ artifact OK: $mjs_count .mjs files + migrations/"

      - name: Verify no bare npm imports in lambda.mjs
        # Guard against tsdown leaving runtime imports (e.g.
        # `import { migrate } from "drizzle-orm/node-postgres/migrator"`)
        # as bare specifiers. At Lambda runtime there is no
        # node_modules/ to resolve these — the bundle is a flat folder
        # of .mjs files. A bare npm import that slips through causes
        # ERR_MODULE_NOT_FOUND on cold start and 504s at the edge.
        #
        # This check targets `import ... from "<package>"` lines where
        # <package> is not `./...` (chunk), `node:...` (built-in), or
        # `_...` (virtual). It also catches `export ... from "<package>"`
        # re-exports and `import "<package>"` (side-effect imports).
        run: |
          set -e
          ARTIFACT=".aws-sam/build/ServerFunction"
          bare=$(grep -nE '^\s*(import|export).*from\s+"([^./]|_[^/])' "$ARTIFACT/lambda.mjs" | grep -v '"node:' || true)
          if [ -n "$bare" ]; then
            echo "✗ lambda.mjs contains bare npm imports that will fail at Lambda runtime:"
            echo "$bare"
            echo ""
            echo "  These must be inlined (see apps/server/src/migrator.ts for an example)"
            echo "  or the package must be added to the bundle's noExternal list."
            exit 1
          fi
          echo "✓ no bare npm imports in lambda.mjs"
