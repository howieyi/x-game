name: Deploy dev

# 每次推送 main 自动部署 dev CloudFormation 环境，也支持手动触发热修复重跑。
# 本工作流不会部署 staging/prod；这些环境应使用具有更严格门禁的独立工作流。
#
# 必需的 GitHub 配置：
#   Secret AWS_DEPLOY_ROLE_ARN → GitHub OIDC 部署角色 ARN
#   Secret BETTER_AUTH_SECRET  → 至少 32 字符且跨部署保持稳定
#   Variable AWS_REGION        → 当前为 us-east-1
#
# 安全模型：
#   GitHub 用 OIDC Token 换取短期 AWS 凭证，不保存长期 AWS Access Key。
#   信任策略和权限策略位于 infra/iam。
#
# 失败边界：
#   - Deploy 步骤之前：尚未修改 AWS 资源。
#   - SAM 部署期间：CloudFormation 按 samconfig.toml 执行回滚。
#   - SAM 部署之后：即使前端同步或冒烟测试失败，基础设施也可能已更新。
#     修复后重跑即可，不要删除 Stack。

on:
  # 自动部署已停用（AWS 环境已关闭）。原先 push 到 main 会自动部署 dev，
  # 现仅保留手动触发，避免在 AWS 关闭期间自动部署失败并创建报警 issue。
  # 恢复自动部署时，取消下方 push 段的注释即可。
  # push:
  #   branches: [main]
  #   # 仅文档、CI 或工作流文件变化时不重复部署。
  #   paths:
  #     - "apps/**"
  #     - "packages/**"
  #     - "scripts/**"
  #     - "template.yaml"
  #     - "samconfig.toml"
  #     - "pnpm-lock.yaml"
  #     - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you triggering this manually?"
        required: false

# 不在部署中途取消；部署期间出现新提交时排队等待，而不是中断当前部署。
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  # 仅本工作流需要 OIDC Token 交换，权限范围保持最小。
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Build + deploy to ${{ vars.AWS_REGION }}/dev
    runs-on: ubuntu-latest
    timeout-minutes: 25  # RDS first deploy is ~10min; leave headroom
    environment:
      name: dev
      # GitHub dev Environment 可配置独立审核人和 Secret，入口为
      # Settings → Environments。

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Schema/migration 漂移检查会读取 HEAD~1，因此需要完整历史。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false  # we run install explicitly below

      - name: Setup Node 20
        # drizzle-kit 0.31.x 需要 Node 20；Node 22 的 strip-types 无法处理
        # Schema 文件中的部分 TypeScript 语法。
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Drizzle schema/migration drift check
        # 如果 Schema 与已提交 migration 漂移，在修改 AWS 前直接失败。
        run: pnpm db:check

      - name: Configure AWS credentials (OIDC)
        # 通过 GitHub OIDC Token 扮演 x-game-deploy-gha，不使用长期密钥。
        # 信任策略限制到本仓库 main 分支和 Tag。
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # 私有 OIDC 场景可取消注释；公共 GitHub Provider 不需要。
          # role-session-name: gha-deploy-dev-${{ github.run_id }}

      - name: Sanity check
        run: |
          aws sts get-caller-identity \
            --query '{Account:Account,Arn:Arn}' --output table
          echo "→ deploying to stage: dev, region: ${{ vars.AWS_REGION }}"

      - name: Build
        # 先只执行 sam build，以便在部署前检查构建产物。
        run: X_GAME_ROOT="$GITHUB_WORKSPACE" sam build

      - name: Verify Lambda artifact integrity
        # 防止 tsdown 拆分 Bundle 后 Makefile 只复制 lambda.mjs 而遗漏 chunk。
        run: |
          set -e
          ARTIFACT=".aws-sam/build/ServerFunction"
          test -f "$ARTIFACT/lambda.mjs" || { echo "✗ lambda.mjs missing"; exit 1; }
          test -d "$ARTIFACT/migrations" || { echo "✗ migrations/ missing"; exit 1; }
          # 设置 noExternal 后通常至少产生 2～3 个 chunk，因此要求至少存在
          # 3 个 mjs 文件，以捕获只复制 lambda.mjs 的回归。
          mjs_count=$(find "$ARTIFACT" -maxdepth 1 -name '*.mjs' | wc -l)
          if [ "$mjs_count" -lt 3 ]; then
            echo "✗ only $mjs_count .mjs file(s) in artifact; tsdown chunks are missing"
            ls -la "$ARTIFACT"
            exit 1
          fi
          echo "✓ artifact OK: $mjs_count .mjs files + migrations/"

      - name: Verify no bare npm imports
        run: |
          set -e
          ARTIFACT=".aws-sam/build/ServerFunction"
          bare=$(grep -nE '^\s*(import|export).*from\s+"([^./]|_[^/])' "$ARTIFACT/lambda.mjs" | grep -v '"node:' || true)
          if [ -n "$bare" ]; then
            echo "✗ lambda.mjs contains bare npm imports:"
            echo "$bare"
            exit 1
          fi
          echo "✓ no bare npm imports"

      - name: Deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          # BETTER_AUTH_SECRET 来自仓库 Secret，可跨运行保持稳定；
          # 部署脚本会强制检查至少 32 字符。
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        # --no-confirm 跳过 SAM 的交互式部署确认。
        run: ./scripts/deploy.sh dev --no-confirm

      - name: Smoke test
        # 部署后访问 /api/auth/get-session。只要不是网络错误或 5xx，就说明
        # CloudFront → VPC Origin → ALB → Lambda 链路已经连通。
        run: |
          set -e
          URL=$(aws cloudformation describe-stacks --stack-name "x-game-dev" \
            --query 'Stacks[0].Outputs[?OutputKey==`WebUrl`].OutputValue' \
            --output text)
          echo "→ smoke test: $URL/api/auth/get-session"
          # 200 或 401 都表示认证链路可达；5xx/504 表示链路异常，
          # 请参考 DEPLOY.md 的故障排查部分。
          code=$(curl -sS -o /tmp/smoke.json -w "%{http_code}" \
            --max-time 30 "$URL/api/auth/get-session" || echo "000")
          echo "  HTTP $code"
          cat /tmp/smoke.json | head -c 400
          echo
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "✗ smoke test failed (HTTP $code)"
            exit 1
          fi

      - name: Tail Lambda logs
        # 输出最近的 [migrate] 日志，便于部署审核直接确认 migration 状态。
        if: always()
        run: |
          aws logs tail /aws/lambda/x-game-server-dev \
            --since 2m --format short 2>/dev/null \
            | grep -E '\[migrate\]|Error' | tail -10 || \
            echo "  (no logs to tail — function may not have been invoked yet)"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const region = '${{ vars.AWS_REGION }}';
            const stack = 'x-game-dev';
            const url = `https://${region}.console.aws.amazon.com/cloudformation/home?region=${region}#/stacks/events?stackId=${stack}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 dev deploy failed (${context.sha.slice(0, 7)})`,
              body: [
                `Deploy to \`dev\` failed.`,
                ``,
                `• Commit: ${context.sha}`,
                `• Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `• Stack events: ${url}`,
                ``,
                `Check CloudWatch logs at \`/aws/lambda/x-game-server-dev\` for the [migrate] / Error lines.`,
              ].join('\n'),
            });
