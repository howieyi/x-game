AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'x-game backend (Hono + tRPC + Better-Auth) on AWS Lambda, plus RDS Aurora
  Serverless v2 for PostgreSQL and S3 + CloudFront for the web frontend.

  '
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - staging
    - prod
    Description: Deployment stage, used for resource naming and capacity.
  BetterAuthSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret used to sign Better-Auth sessions. Must be >=32 chars.
  AuroraMinCapacity:
    Type: Number
    Default: 0.5
    MinValue: 0.5
    MaxValue: 128
    Description: Aurora Serverless v2 minimum ACU.
  AuroraMaxCapacity:
    Type: Number
    Default: 4
    MinValue: 0.5
    MaxValue: 128
    Description: Aurora Serverless v2 maximum ACU.
  LambdaMemoryMb:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Lambda memory (MB). More memory = more CPU + network bandwidth.
  DeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'true'
    - 'false'
    Description: Enable deletion protection on Aurora + CloudFront (recommended for
      prod).
Conditions:
  EnableDeletionProtection:
    Fn::Equals:
    - Ref: DeletionProtection
    - 'true'
Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize:
      Ref: LambdaMemoryMb
    Timeout: 30
    Architectures:
    - x86_64
    Environment:
      Variables:
        NODE_ENV: production
        SKIP_ENV_VALIDATION: 'true'
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Tags:
      Project: x-game
      Stage:
        Ref: Stage
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: x-game-vpc-${Stage}
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
      - Key: Name
        Value:
          Fn::Sub: x-game-igw-${Stage}
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: Vpc
      InternetGatewayId:
        Ref: InternetGateway
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      MapPublicIpOnLaunch: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: x-game-public-${Stage}-a
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      MapPublicIpOnLaunch: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: x-game-public-${Stage}-b
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Name
        Value:
          Fn::Sub: x-game-private-${Stage}-a
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Name
        Value:
          Fn::Sub: x-game-private-${Stage}-b
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId:
        Ref: InternetGateway
  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      SubnetId:
        Ref: PublicSubnet1
  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      SubnetId:
        Ref: PublicSubnet2
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId:
        Fn::GetAtt:
        - NatEip
        - AllocationId
      SubnetId:
        Ref: PublicSubnet1
      Tags:
      - Key: Name
        Value:
          Fn::Sub: x-game-nat-${Stage}
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: PrivateRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId:
        Ref: NatGateway
  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PrivateRouteTable
      SubnetId:
        Ref: PrivateSubnet1
  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PrivateRouteTable
      SubnetId:
        Ref: PrivateSubnet2
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: x-game Aurora subnets
      SubnetIds:
      - Ref: PrivateSubnet1
      - Ref: PrivateSubnet2
      Tags:
      - Key: Name
        Value:
          Fn::Sub: x-game-db-subnets-${Stage}
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL from Lambda SG
      VpcId:
        Ref: Vpc
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        SourceSecurityGroupId:
          Ref: LambdaSecurityGroup
        Description: PostgreSQL from Lambda
      Tags:
      - Key: Name
        Value:
          Fn::Sub: x-game-db-sg-${Stage}
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda egress (HTTPS out + PostgreSQL to VPC CIDR)
      VpcId:
        Ref: Vpc
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: '0.0.0.0/0'
        Description: HTTPS egress (Secrets Manager, ECR, CloudWatch)
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        CidrIp: 10.0.0.0/16
        Description: PostgreSQL to Aurora (VPC CIDR)
      Tags:
      - Key: Name
        Value:
          Fn::Sub: x-game-lambda-sg-${Stage}
  AuroraCluster:
    DeletionPolicy:
      Fn::If:
      - EnableDeletionProtection
      - Retain
      - Snapshot
    UpdateReplacePolicy:
      Fn::If:
      - EnableDeletionProtection
      - Retain
      - Snapshot
    Metadata:
      SamLintIgnore: true
      cfn-lint:
        config:
          ignore_checks:
          - E1020
          - E6101
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: '16.4'
      DatabaseName: xgame
      MasterUsername: postgres
      ManageMasterUserPassword: true
      Port: 5432
      StorageEncrypted: true
      EnableCloudwatchLogsExports:
      - postgresql
      DBSubnetGroupName:
        Ref: DatabaseSubnetGroup
      VpcSecurityGroupIds:
      - Ref: DatabaseSecurityGroup
      ServerlessV2ScalingConfiguration:
        MinCapacity:
          Ref: AuroraMinCapacity
        MaxCapacity:
          Ref: AuroraMaxCapacity
      DeletionProtection:
        Fn::If:
        - EnableDeletionProtection
        - true
        - false
      Tags:
      - Key: Name
        Value:
          Fn::Sub: x-game-aurora-${Stage}
  AuroraInstance:
    DeletionPolicy:
      Fn::If:
      - EnableDeletionProtection
      - Retain
      - Delete
    UpdateReplacePolicy:
      Fn::If:
      - EnableDeletionProtection
      - Retain
      - Delete
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier:
        Ref: AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      Tags:
      - Key: Name
        Value:
          Fn::Sub: x-game-aurora-${Stage}-writer
  ServerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      SamResourceId: ServerFunction
    Properties:
      FunctionName:
        Fn::Sub: x-game-server-${Stage}
      CodeUri: ServerFunction
      Handler: lambda.handler
      PackageType: Zip
      MemorySize:
        Ref: LambdaMemoryMb
      Timeout: 30
      VpcConfig:
        SecurityGroupIds:
        - Ref: LambdaSecurityGroup
        SubnetIds:
        - Ref: PrivateSubnet1
        - Ref: PrivateSubnet2
      Environment:
        Variables:
          DATABASE_URL:
            Fn::Sub:
            - postgresql://postgres:${Password}@${Host}:5432/xgame?sslmode=require
            - Password: '{{resolve:secretsmanager:${AuroraCluster.MasterUserSecret.SecretArn}::password}}'
              Host:
                Fn::GetAtt:
                - AuroraCluster
                - Endpoint.Address
          BETTER_AUTH_SECRET:
            Ref: BetterAuthSecret
          BETTER_AUTH_URL:
            Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
          CORS_ORIGIN:
            Fn::Sub: https://${WebDistribution.DomainName}
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            TimeoutInMillis: 30000
      Policies:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: AuroraCluster.MasterUserSecret.SecretArn
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName:
        Ref: Stage
      Description:
        Fn::Sub: x-game API (${Stage})
      CorsConfiguration:
        AllowOrigins:
        - Fn::Sub: https://${WebDistribution.DomainName}
        AllowMethods:
        - GET
        - POST
        - OPTIONS
        AllowHeaders:
        - Content-Type
        - Authorization
        AllowCredentials: true
      Tags:
        Stage:
          Ref: Stage
  HttpApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/vendedlogs/x-game-api-${Stage}
      RetentionInDays: 14
  ServerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/x-game-server-${Stage}
      RetentionInDays: 14
  WebBucket:
    DeletionPolicy:
      Fn::If:
      - EnableDeletionProtection
      - Retain
      - Delete
    UpdateReplacePolicy:
      Fn::If:
      - EnableDeletionProtection
      - Retain
      - Delete
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: x-game-web-${Stage}-${AWS::AccountId}
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      Tags:
      - Key: Name
        Value:
          Fn::Sub: x-game-web-${Stage}
  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: x-game-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
        Description:
          Fn::Sub: OAC for x-game web (${Stage})
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment:
          Fn::Sub: x-game web (${Stage})
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
        - Id: S3Origin
          DomainName:
            Fn::GetAtt:
            - WebBucket
            - RegionalDomainName
          OriginAccessControlId:
            Fn::GetAtt:
            - WebOAC
            - Id
          S3OriginConfig:
            OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          CachedMethods:
          - GET
          - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
        - ErrorCode: 403
          ResponseCode: 200
          ResponsePagePath: /index.html
          ErrorCachingMinTTL: 0
        - ErrorCode: 404
          ResponseCode: 200
          ResponsePagePath: /index.html
          ErrorCachingMinTTL: 0
      Tags:
      - Key: Stage
        Value:
          Ref: Stage
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowCloudFrontServicePrincipalReadOnly
          Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${WebBucket.Arn}/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}
Outputs:
  Stage:
    Value:
      Ref: Stage
    Export:
      Name:
        Fn::Sub: x-game-stage-${Stage}
  ApiEndpoint:
    Description: HTTPS endpoint of the API (HTTP API v2)
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name:
        Fn::Sub: x-game-api-endpoint-${Stage}
  ServerFunctionName:
    Description: Lambda function name
    Value:
      Ref: ServerFunction
    Export:
      Name:
        Fn::Sub: x-game-server-function-${Stage}
  DatabaseEndpoint:
    Description: Aurora cluster endpoint (private)
    Value:
      Fn::GetAtt:
      - AuroraCluster
      - Endpoint.Address
    Export:
      Name:
        Fn::Sub: x-game-db-endpoint-${Stage}
  DatabaseSecretArn:
    Description: Secrets Manager ARN holding the auto-generated master password
    Value:
      Ref: AuroraCluster.MasterUserSecret.SecretArn
  WebBucketName:
    Description: S3 bucket for web assets
    Value:
      Ref: WebBucket
    Export:
      Name:
        Fn::Sub: x-game-web-bucket-${Stage}
  WebDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value:
      Ref: WebDistribution
    Export:
      Name:
        Fn::Sub: x-game-web-distribution-${Stage}
  WebUrl:
    Description: Public URL of the web frontend
    Value:
      Fn::Sub: https://${WebDistribution.DomainName}
    Export:
      Name:
        Fn::Sub: x-game-web-url-${Stage}
