AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  x-game backend (Hono + tRPC + Better-Auth) on AWS Lambda, plus standard RDS
  PostgreSQL (non-Aurora) and S3 + CloudFront for the web frontend.

# ============================================================================
# 部署模板阅读指南
# ============================================================================
# 本文件是基础设施的“唯一事实来源”。scripts/deploy.sh 负责调用 SAM，但真正
# 创建、更新和删除哪些 AWS 资源，以本文件为准。
#
# 请求链：
#   Browser → CloudFront（唯一公网入口）
#     → /*                 → 私有 S3 WebBucket
#     → /api/*、/trpc/*   → VPC Origin → internal ALB → Lambda → RDS
#
# 异步链：
#   ServerFunction → SNS → SQS → GameEventWorkerFunction
#                              └→ 失败 5 次后进入 DLQ
#
# 巡检链：
#   CloudWatch Synthetics（每 5 分钟）→ GET / 与 GET /api/health
#
# 修改注意：
# 1. CloudFront 自定义证书必须位于 us-east-1。
# 2. Stateful 资源的 DeletionPolicy/UpdateReplacePolicy 不要随意删除。
# 3. BetterAuthSecret 的真实值不得提交，由 deploy.sh 临时注入。
# 4. Cloudflare DNS 不由本模板管理，只需 DNS-only CNAME 指向 CloudFront。
# 5. NAT Gateway、RDS、VPC Origin 和 Synthetics 都可能产生持续费用。
#
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage, used for resource naming and capacity.

  BetterAuthSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >
      Secret used to sign Better-Auth sessions. Must be >=32 chars. Keep it
      stable across updates or all existing login sessions become invalid.

  FeishuAnalyticsWebhookUrl:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Optional Feishu custom-bot webhook for behavior anomaly alerts. Leave
      empty to disable notifications while keeping event collection enabled.

  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: >
      RDS PostgreSQL instance class. Standard (non-Aurora) RDS is used because
      this AWS account's plan rejects Aurora DBCluster creation entirely. The
      account is also restricted to free-tier-eligible instance sizes
      (db.t3.micro / db.t4g.micro) — larger classes fail with "This instance
      size isn't available with free plan accounts."

  LambdaMemoryMb:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Lambda memory (MB). More memory = more CPU + network bandwidth.

  DeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable deletion protection on the database + CloudFront (recommended for prod).

  CustomDomain:
    Type: String
    Default: ""
    Description: Optional custom hostname served by CloudFront.

  CertificateArn:
    Type: String
    Default: ""
    Description: >
      ACM certificate ARN in us-east-1 covering CustomDomain. CloudFront rejects
      certificates from every other region.

Conditions:
  # 条件让同一模板同时支持可随时释放的 dev 环境和受保护的 prod 环境。
  EnableDeletionProtection: !Equals [!Ref DeletionProtection, "true"]
  UseCustomDomain: !And
    - !Not [!Equals [!Ref CustomDomain, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]

Globals:
  # 两个 Lambda 函数默认继承这些配置，除非在函数资源中显式覆盖。
  Function:
    Runtime: nodejs22.x
    MemorySize: !Ref LambdaMemoryMb
    Timeout: 30
    Architectures: [x86_64]
    Environment:
      Variables:
        NODE_ENV: production
        SKIP_ENV_VALIDATION: "true"
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Tags:
      Project: x-game
      Stage: !Ref Stage

Resources:
  # ────────────────────────────────────────────────────────────────────
  # 网络：跨两个可用区创建公有/私有子网，并通过 NAT 提供出站访问，
  # 使私有子网内的 Lambda 能访问 Secrets Manager、日志等 AWS 服务。
  # ────────────────────────────────────────────────────────────────────
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub x-game-vpc-${Stage}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub x-game-igw-${Stage}

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub x-game-public-${Stage}-a

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub x-game-public-${Stage}-b

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub x-game-private-${Stage}-a

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub x-game-private-${Stage}-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub x-game-nat-${Stage}

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2

  # ────────────────────────────────────────────────────────────────────
  # 数据库：私有子网中的标准 RDS PostgreSQL（非 Aurora）。
  # 主密码由 RDS 自动生成并保存到 Secrets Manager。
  # ────────────────────────────────────────────────────────────────────
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: x-game DB subnets
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub x-game-db-subnets-${Stage}

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL from Lambda SG
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: PostgreSQL from Lambda
      Tags:
        - Key: Name
          Value: !Sub x-game-db-sg-${Stage}

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda egress (HTTPS out + PostgreSQL to VPC CIDR)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS egress (Secrets Manager, ECR, CloudWatch)
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16
          Description: PostgreSQL to RDS (VPC CIDR)
      Tags:
        - Key: Name
          Value: !Sub x-game-lambda-sg-${Stage}

  # ────────────────────────────────────────────────────────────────────
  # 私有 API 访问：内网 ALB + CloudFront VPC Origin。
  #
  # CloudFront VPC Origin 只能使用 ALB、NLB 或 EC2 作为源站，不能直接连接
  # API Gateway。因此在私有子网中使用内网 ALB。CloudFront 通过 AWS 管理的
  # ENI 经骨干网访问 ALB；Scheme=internal 保证 ALB 不对公网开放。
  # ALB Target Group 使用 target-type=lambda，直接调用 Lambda。
  # ────────────────────────────────────────────────────────────────────
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB - accept HTTP from CloudFront VPC Origin ENIs
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # CloudFront VPC Origin ENI 传入的流量仍保留 CloudFront 面向源站的公网
        # 源 IP，并不会改写成 ENI 私网地址。因此只允许 VPC CIDR 会静默丢弃
        # SYN，表现为 ALB RequestCount=0、CloudFront 504，但 Reachability
        # Analyzer 仍可能认为 ENI→ALB 路径正常。这里使用 AWS 托管前缀列表
        # com.amazonaws.global.cloudfront.origin-facing（us-east-1 中为
        # pl-3b927c52）作为官方推荐修复方式。
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: pl-3b927c52
          Description: HTTP from CloudFront origin-facing range (VPC Origin traffic)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 10.0.0.0/16
          Description: HTTP from VPC CIDR (internal health / debug)
      Tags:
        - Key: Name
          Value: !Sub x-game-alb-sg-${Stage}

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internal
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "60"
      Tags:
        - Key: Name
          Value: !Sub x-game-alb-${Stage}

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    # 必须等待 AlbInvokePermission；如果在 ALB 获得调用权限前注册 Lambda
    # Target，会因 AccessDenied 失败。
    DependsOn: AlbInvokePermission
    Properties:
      TargetType: lambda
      Name: !Sub x-game-tg-${Stage}
      Targets:
        - Id: !GetAtt ServerFunction.Arn
      # 必须启用健康检查，Target 才能离开 unavailable 状态并接收流量。
      # Matcher 同时接受 Better-Auth 未登录时的 401 和 Hono 未知路由的 404，
      # 因为这些状态也能证明 Lambda 可达。
      HealthCheckEnabled: true
      HealthCheckPath: /api/auth/get-session
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      HealthCheckTimeoutSeconds: 5
      HealthCheckIntervalSeconds: 10
      Matcher:
        HttpCode: "200,201,204,400,401,403,404"

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  # ALB 调用 Lambda 需要显式权限。SourceArn 使用 Target Group 固定名称加随机
  # 后缀通配符构造，而不使用 !Ref AlbTargetGroup。若使用 Ref，本资源会隐式
  # 依赖 AlbTargetGroup，再与 AlbTargetGroup 对本资源的 DependsOn 形成循环依赖。
  AlbInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ServerFunction
      Action: lambda:InvokeFunction
      Principal: elasticloadbalancing.amazonaws.com
      SourceArn: !Sub "arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/x-game-tg-${Stage}/*"

  # CloudFront VPC Origin 通过 AWS 骨干网连接 CloudFront 与 ALB。
  # DomainName 使用 ALB DNS；由于 ALB 是 internal，该域名解析为私网 IP，
  # CloudFront 通过在私有子网中创建的服务托管 ENI 访问它。
  #
  # Logical ID 和 Name 带版本后缀，是因为 VPC Origin 曾出现 PrivateLink
  # 静默失效：CloudFront 边缘超时、ALB RequestCount 始终为 0，但 Origin
  # 显示 Deployed，Reachability Analyzer 也认为 ENI→ALB:80 正常。
  # 重建 CloudFront 托管 ENI 必须完整替换资源；仅修改 Name 会触发原地更新，
  # Origin 仍关联 Distribution 时会被 CloudFront 以 409 拒绝。提升 Logical ID
  # 才会强制“新建 → 重指向 Distribution → 删除旧资源”。若再次出现该症状，
  # 请同时提升 Logical ID 与 Name 的版本后缀。
  ApiVpcOriginV3:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub x-game-api-vpco-${Stage}-v3
        Arn: !GetAtt Alb.LoadBalancerArn
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
        OriginSSLProtocols:
          - TLSv1.2
      Tags:
        - Key: Name
          Value: !Sub x-game-api-vpco-${Stage}-v3

  Database:
    DeletionPolicy: !If [EnableDeletionProtection, Retain, Snapshot]
    UpdateReplacePolicy: !If [EnableDeletionProtection, Retain, Snapshot]
    Metadata:
      # SAM CLI 使用的 cfn-lint 可能无法识别 AWS::RDS::DBInstance 的
      # MasterUserSecret 属性，但该属性是 CloudFormation 官方支持项：
      # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-rds-dbinstance.html
      # 当 ManageMasterUserPassword=true 时，它返回自动生成主密码对应的
      # Secrets Manager ARN。
      SamLintIgnore: true
      cfn-lint:
        config:
          ignore_checks:
            - E1020
            - E6101
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      EngineVersion: "16.14"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      DBName: xgame
      MasterUsername: postgres
      ManageMasterUserPassword: true
      Port: 5432
      StorageEncrypted: true
      EnableCloudwatchLogsExports:
        - postgresql
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      DeletionProtection: !If [EnableDeletionProtection, true, false]
      Tags:
        - Key: Name
          Value: !Sub x-game-db-${Stage}

  # ────────────────────────────────────────────────────────────────────
  # Lambda 函数：Hono 应用由内网 ALB 通过 target-type=lambda 的 Target Group
  # 直接调用，因此不需要 HttpApi Event。此 Stack 保留 VpcConfig，让 Lambda
  # 位于私有子网并直接访问 RDS；这里没有使用 RDS Data API。
  # ────────────────────────────────────────────────────────────────────
  ServerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub x-game-platform-server-${Stage}
      CodeUri: ./apps/server
      Handler: lambda.handler
      PackageType: Zip
      MemorySize: !Ref LambdaMemoryMb
      Timeout: 30
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          # Lambda 在冷启动时读取密钥，对密码执行 URL 编码后再构造
          # DATABASE_URL。CloudFormation 的 !Sub 不支持 URL 编码，而 RDS
          # 自动密码可能包含特殊字符，直接拼接会导致 new URL() 失败。
          DB_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
          # RDS 托管密钥只保存用户名和密码，主机、端口、库名需分别注入。
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_PORT: !GetAtt Database.Endpoint.Port
          DB_NAME: xgame
          BETTER_AUTH_SECRET: !Ref BetterAuthSecret
          BETTER_AUTH_URL: !If
            - UseCustomDomain
            - !Sub "https://${CustomDomain}"
            - !Sub "https://${WebDistribution.DomainName}"
          CORS_ORIGIN: !If
            - UseCustomDomain
            - !Sub "https://${CustomDomain}"
            - !Sub "https://${WebDistribution.DomainName}"
          GAME_EVENTS_TOPIC_ARN: !Ref GameEventsTopic
          FEISHU_ANALYTICS_WEBHOOK_URL: !Ref FeishuAnalyticsWebhookUrl
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt Database.MasterUserSecret.SecretArn
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref GameEventsTopic

  ServerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/x-game-platform-server-${Stage}"
      RetentionInDays: 14

  # ────────────────────────────────────────────────────────────────────
  # 可靠游戏领域事件链：API → SNS → SQS → 消费 Lambda → 死信队列。
  # ────────────────────────────────────────────────────────────────────
  MessagingKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "x-game messaging encryption (${Stage})"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowSnsAndSqsUse
            Effect: Allow
            Principal:
              Service:
                - sns.amazonaws.com
                - sqs.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: "*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Tags:
        - Key: Project
          Value: x-game

  GameEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub x-game-events-${Stage}
      KmsMasterKeyId: !Ref MessagingKey

  GameEventsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub x-game-events-dlq-${Stage}
      # 1,209,600 秒等于 14 天（SQS 上限），为排查和修复后重新驱动坏消息
      # 留出足够时间。
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      KmsMasterKeyId: !Ref MessagingKey

  GameEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub x-game-events-${Stage}
      # 可见性超时大于消费函数的 30 秒超时，避免消息过早重新投递并并发处理。
      VisibilityTimeout: 180
      # 消费函数故障期间，普通事件保留 4 天。
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      KmsMasterKeyId: !Ref MessagingKey
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt GameEventsDeadLetterQueue.Arn
        # 接收失败 5 次后移入死信队列，避免坏消息持续阻塞事件流。
        maxReceiveCount: 5

  GameEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref GameEventsQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOnlyGameEventsTopic
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt GameEventsQueue.Arn
            Condition:
              ArnEquals:
                "aws:SourceArn": !Ref GameEventsTopic
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId

  GameEventsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref GameEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt GameEventsQueue.Arn
      # 保留 SNS Envelope；消费端按“SQS Body → SNS Message”两层解析。
      RawMessageDelivery: false

  GameEventWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub x-game-event-worker-${Stage}
      CodeUri: ./apps/server
      Handler: eventWorker.handler
      PackageType: Zip
      MemorySize: 256
      Timeout: 30
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt GameEventsQueue.QueueName
        - KMSDecryptPolicy:
            KeyId: !Ref MessagingKey
      Events:
        GameEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt GameEventsQueue.Arn
            # 每次最多处理 10 条记录；部分失败响应会删除成功记录，只重试失败项。
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  GameEventsDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub x-game-events-dlq-visible-${Stage}
      AlarmDescription: Game events exhausted retries and reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt GameEventsDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ────────────────────────────────────────────────────────────────────
  # Web 前端：私有 S3 Bucket 通过 CloudFront OAC 提供访问。
  # deploy.sh 会上传 apps/web/dist，并创建 CloudFront Invalidation。
  # ────────────────────────────────────────────────────────────────────
  WebBucket:
    DeletionPolicy: !If [EnableDeletionProtection, Retain, Delete]
    UpdateReplacePolicy: !If [EnableDeletionProtection, Retain, Delete]
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub x-game-web-${Stage}-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub x-game-web-${Stage}

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub x-game-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
        Description: !Sub "OAC for x-game web (${Stage})"

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "x-game web (${Stage})"
        Aliases: !If
          - UseCustomDomain
          - [!Ref CustomDomain]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - UseCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiVpcOrigin
            DomainName: !GetAtt Alb.DNSName
            VpcOriginConfig:
              VpcOriginId: !GetAtt ApiVpcOriginV3.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # 使用 AWS 托管 CachingOptimized 策略。带哈希资源可长期缓存；
          # deploy.sh 会单独以 no-cache 上传 index.html。
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: "/trpc/*"
            TargetOriginId: ApiVpcOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
          - PathPattern: "/api/*"
            TargetOriginId: ApiVpcOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
        CustomErrorResponses:
          # 将 S3 对未知对象的响应转换为 SPA 入口，使客户端路由能解析
          # /gravity-rift 等路径。
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Stage
          Value: !Ref Stage

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

  # ────────────────────────────────────────────────────────────────────
  # CloudWatch Synthetics：执行首页与 API 健康检查的浏览器级巡检。
  # ────────────────────────────────────────────────────────────────────
  SyntheticsArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub x-game-synthetics-${Stage}-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCanaryArtifacts
            Status: Enabled
            ExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SyntheticsCanaryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: x-game-synthetics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt SyntheticsArtifactsBucket.Arn
                  - !Sub "${SyntheticsArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - cloudwatch:PutMetricData
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - xray:PutTraceSegments
                Resource: "*"

  PlatformCanary:
    Type: AWS::Synthetics::Canary
    Properties:
      Name: !Sub x-game-platform-${Stage}
      ExecutionRoleArn: !GetAtt SyntheticsCanaryRole.Arn
      ArtifactS3Location: !Sub "s3://${SyntheticsArtifactsBucket}/artifacts"
      RuntimeVersion: syn-nodejs-puppeteer-16.1
      StartCanaryAfterCreation: true
      ProvisionedResourceCleanup: AUTOMATIC
      Schedule:
        # Duration=0 表示持续运行；每 5 分钟一次即每天 288 次。
        Expression: rate(5 minutes)
        DurationInSeconds: "0"
      RunConfig:
        TimeoutInSeconds: 60
        MemoryInMB: 1024
        ActiveTracing: true
        EnvironmentVariables:
          BASE_URL: !If
            - UseCustomDomain
            - !Sub "https://${CustomDomain}"
            - !Sub "https://${WebDistribution.DomainName}"
      Code:
        Handler: index.handler
        Script: |
          const synthetics = require('Synthetics');
          const log = require('SyntheticsLogger');
          exports.handler = async () => {
            const base = new URL(process.env.BASE_URL);
            const request = (path) => ({
              hostname: base.hostname,
              protocol: 'https:',
              port: 443,
              method: 'GET',
              path,
              headers: { 'User-Agent': 'x-game-synthetics' }
            });
            await synthetics.executeHttpStep('homepage', request('/'), async (res) => {
              if (res.statusCode !== 200) throw new Error(`Homepage returned ${res.statusCode}`);
            });
            await synthetics.executeHttpStep('api-health', request('/api/health'), async (res) => {
              if (res.statusCode !== 200) throw new Error(`API health returned ${res.statusCode}`);
            });
            log.info('NEXUS platform巡检 passed');
          };

  PlatformCanaryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub x-game-synthetics-success-${Stage}
      AlarmDescription: NEXUS synthetic巡检 success rate dropped below 90%.
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - Name: CanaryName
          Value: !Ref PlatformCanary
      Statistic: Average
      Period: 300
      # 最近 3 个数据点中至少 2 个低于阈值才告警，过滤单次边缘节点瞬时错误。
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 90
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

Outputs:
  # deploy.sh 按精确名称读取 WebBucketName、WebDistributionId 和 WebUrl；
  # 如需重命名，必须同步修改 deploy.sh 与 CI。
  Stage:
    Value: !Ref Stage
    Export:
      Name: !Sub x-game-stage-${Stage}

  ApiEndpoint:
    Description: Internal ALB DNS name (the API origin; not directly reachable from the internet - only via CloudFront VPC Origin)
    Value: !GetAtt Alb.DNSName
    Export:
      Name: !Sub x-game-api-endpoint-${Stage}

  PublicUrl:
    Description: Single public entry point - all traffic (web + API) goes through CloudFront
    Value: !If
      - UseCustomDomain
      - !Sub "https://${CustomDomain}"
      - !Sub "https://${WebDistribution.DomainName}"
    Export:
      Name: !Sub x-game-public-url-${Stage}

  ServerFunctionName:
    Description: Lambda function name
    Value: !Ref ServerFunction
    Export:
      Name: !Sub x-game-server-function-${Stage}

  DatabaseEndpoint:
    Description: RDS instance endpoint (private)
    Value: !GetAtt Database.Endpoint.Address
    Export:
      Name: !Sub x-game-db-endpoint-${Stage}

  DatabaseSecretArn:
    Description: Secrets Manager ARN holding the auto-generated master password
    Value: !GetAtt Database.MasterUserSecret.SecretArn

  WebBucketName:
    Description: S3 bucket for web assets
    Value: !Ref WebBucket
    Export:
      Name: !Sub x-game-web-bucket-${Stage}

  WebDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref WebDistribution
    Export:
      Name: !Sub x-game-web-distribution-${Stage}

  WebUrl:
    Description: Public URL of the web frontend
    Value: !If
      - UseCustomDomain
      - !Sub "https://${CustomDomain}"
      - !Sub "https://${WebDistribution.DomainName}"
    Export:
      Name: !Sub x-game-web-url-${Stage}

  GameEventsTopicArn:
    Description: SNS topic for game domain events
    Value: !Ref GameEventsTopic

  GameEventsQueueUrl:
    Description: SQS queue subscribed to game domain events
    Value: !Ref GameEventsQueue

  GameEventsDeadLetterQueueUrl:
    Description: Dead-letter queue for failed game event processing
    Value: !Ref GameEventsDeadLetterQueue

  SyntheticsCanaryName:
    Description: CloudWatch Synthetics platform canary
    Value: !Ref PlatformCanary
