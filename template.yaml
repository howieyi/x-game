AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  x-game backend (Hono + tRPC + Better-Auth) on AWS Lambda, plus standard RDS
  PostgreSQL (non-Aurora) and S3 + CloudFront for the web frontend.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage, used for resource naming and capacity.

  BetterAuthSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret used to sign Better-Auth sessions. Must be >=32 chars.

  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: >
      RDS PostgreSQL instance class. Standard (non-Aurora) RDS is used because
      this AWS account's plan rejects Aurora DBCluster creation entirely. The
      account is also restricted to free-tier-eligible instance sizes
      (db.t3.micro / db.t4g.micro) — larger classes fail with "This instance
      size isn't available with free plan accounts."

  LambdaMemoryMb:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Lambda memory (MB). More memory = more CPU + network bandwidth.

  DeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable deletion protection on the database + CloudFront (recommended for prod).

Conditions:
  EnableDeletionProtection: !Equals [!Ref DeletionProtection, "true"]

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: !Ref LambdaMemoryMb
    Timeout: 30
    Architectures: [x86_64]
    Environment:
      Variables:
        NODE_ENV: production
        SKIP_ENV_VALIDATION: "true"
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Tags:
      Project: x-game
      Stage: !Ref Stage

Resources:
  # ────────────────────────────────────────────────────────────────────
  # Networking: VPC with 2 AZs, public + private subnets, NAT for egress
  # (so the Lambda in private subnets can reach Secrets Manager + ECR).
  # ────────────────────────────────────────────────────────────────────
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub x-game-vpc-${Stage}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub x-game-igw-${Stage}

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub x-game-public-${Stage}-a

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub x-game-public-${Stage}-b

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub x-game-private-${Stage}-a

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub x-game-private-${Stage}-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub x-game-nat-${Stage}

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2

  # ────────────────────────────────────────────────────────────────────
  # Database: standard RDS PostgreSQL (non-Aurora) in private subnets.
  # Master password auto-generated and stored in Secrets Manager.
  # ────────────────────────────────────────────────────────────────────
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: x-game DB subnets
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub x-game-db-subnets-${Stage}

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL from Lambda SG
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: PostgreSQL from Lambda
      Tags:
        - Key: Name
          Value: !Sub x-game-db-sg-${Stage}

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda egress (HTTPS out + PostgreSQL to VPC CIDR)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS egress (Secrets Manager, ECR, CloudWatch)
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16
          Description: PostgreSQL to RDS (VPC CIDR)
      Tags:
        - Key: Name
          Value: !Sub x-game-lambda-sg-${Stage}

  # ────────────────────────────────────────────────────────────────────
  # Private API access: internal ALB + CloudFront VPC Origin.
  #
  # CloudFront VPC Origin only supports ALB / NLB / EC2 as origin targets,
  # NOT API Gateway directly. So we replace API Gateway with an internal
  # ALB in the private subnets. CloudFront VPC Origin reaches the ALB over
  # the AWS backbone via service-managed ENIs; the ALB is not reachable
  # from the public internet (Scheme=internal). Lambda is wired as the ALB
  # target group with target-type=lambda, so no VPC integration is needed.
  # ────────────────────────────────────────────────────────────────────
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB - accept HTTP from CloudFront VPC Origin ENIs
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 10.0.0.0/16
          Description: HTTP from VPC CIDR (CloudFront VPC Origin + internal health)
      Tags:
        - Key: Name
          Value: !Sub x-game-alb-sg-${Stage}

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internal
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "60"
      Tags:
        - Key: Name
          Value: !Sub x-game-alb-${Stage}

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    # Must wait for AlbInvokePermission — registering the Lambda target
    # before ALB has invoke permission fails with AccessDenied.
    DependsOn: AlbInvokePermission
    Properties:
      TargetType: lambda
      Name: !Sub x-game-tg-${Stage}
      Targets:
        - Id: !GetAtt ServerFunction.Arn
      # Health check is required for the target to transition out of
      # `unavailable` state — without it, ALB doesn't route. The
      # `Matcher's HttpCode` covers Better-Auth's unauthenticated 401
      # and Hono's 404 on unknown routes, since both indicate a
      # reachable Lambda.
      HealthCheckEnabled: true
      HealthCheckPath: /api/auth/get-session
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      HealthCheckTimeoutSeconds: 5
      HealthCheckIntervalSeconds: 10
      Matcher:
        HttpCode: "200,201,204,400,401,403,404"

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  # ALB needs explicit permission to invoke the Lambda. SourceArn is built
  # from the target group's fixed Name (with a wildcard for the random
  # suffix CloudFormation assigns) rather than !Ref AlbTargetGroup — using
  # Ref here would make this resource implicitly depend on AlbTargetGroup,
  # which combined with AlbTargetGroup's DependsOn on this resource (needed
  # so the Lambda target isn't registered before the permission exists)
  # would create a circular dependency.
  AlbInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ServerFunction
      Action: lambda:InvokeFunction
      Principal: elasticloadbalancing.amazonaws.com
      SourceArn: !Sub "arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/x-game-tg-${Stage}/*"

  # CloudFront VPC Origin bridges CF → ALB over the AWS backbone.
  # DomainName is the ALB's public DNS (which resolves to private IPs
  # because the ALB is internal — the AWS backbone resolves it through
  # the service-managed ENI CloudFront creates in our private subnets).
  #
  # The Name carries a version suffix relative to the original
  # `x-game-api-vpco-${Stage}`. VPC Origins have twice gotten into a
  # state where the PrivateLink connection silently failed (CF edge
  # timed out, ALB RequestCount stayed at 0) even though the origin
  # reported `Deployed` and Reachability Analyzer confirmed the
  # in-VPC path (CF ENI → ALB:80) was fine. Forcing a replacement
  # via Name change rebuilds the CF-managed ENIs and re-establishes
  # the connection. Bump the suffix again if the symptom recurs.
  ApiVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub x-game-api-vpco-${Stage}-v3
        Arn: !GetAtt Alb.LoadBalancerArn
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
        OriginSSLProtocols:
          - TLSv1.2
      Tags:
        - Key: Name
          Value: !Sub x-game-api-vpco-${Stage}-v3

  Database:
    DeletionPolicy: !If [EnableDeletionProtection, Retain, Snapshot]
    UpdateReplacePolicy: !If [EnableDeletionProtection, Retain, Snapshot]
    Metadata:
      # SAM CLI's lint check (cfn-lint) doesn't know about the
      # MasterUserSecret attribute on AWS::RDS::DBInstance. The attribute IS
      # valid CloudFormation and documented at
      # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-rds-dbinstance.html
      # — it returns the Secrets Manager ARN for the auto-generated master
      # password when ManageMasterUserPassword=true.
      SamLintIgnore: true
      cfn-lint:
        config:
          ignore_checks:
            - E1020
            - E6101
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      EngineVersion: "16.14"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      DBName: xgame
      MasterUsername: postgres
      ManageMasterUserPassword: true
      Port: 5432
      StorageEncrypted: true
      EnableCloudwatchLogsExports:
        - postgresql
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      DeletionProtection: !If [EnableDeletionProtection, true, false]
      Tags:
        - Key: Name
          Value: !Sub x-game-db-${Stage}

  # ────────────────────────────────────────────────────────────────────
  # Lambda function: Hono app invoked by the internal ALB via Lambda
  # target group (target-type=lambda). No HttpApi event needed — the ALB
  # invokes the function directly. Lambda does NOT live in a VPC; it talks
  # to the database over RDS Data API is not used here, instead we proxy via the
  # VPC's RDS Proxy or — for this stack — keep the Lambda in-VPC. See
  # note below: we keep VpcConfig so the function can reach the database directly.
  # ────────────────────────────────────────────────────────────────────
  ServerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub x-game-server-${Stage}
      CodeUri: ./apps/server
      Handler: lambda.handler
      PackageType: Zip
      MemorySize: !Ref LambdaMemoryMb
      Timeout: 30
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          # The Lambda fetches the secret at cold start and URL-encodes the
          # password before constructing DATABASE_URL. We can't build the URL
          # in the template because CFN's !Sub has no URL-encoding function,
          # and RDS auto-generates passwords with special chars (`(`, `)`,
          # `#`, `*`, `|`, etc.) that crash `new URL()` if left raw.
          DB_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
          # The RDS-managed secret above only holds username/password —
          # connection coordinates are injected separately.
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_PORT: !GetAtt Database.Endpoint.Port
          DB_NAME: xgame
          BETTER_AUTH_SECRET: !Ref BetterAuthSecret
          BETTER_AUTH_URL: !Sub "https://${WebDistribution.DomainName}"
          CORS_ORIGIN: !Sub "https://${WebDistribution.DomainName}"
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt Database.MasterUserSecret.SecretArn

  ServerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/x-game-server-${Stage}"
      RetentionInDays: 14

  # ────────────────────────────────────────────────────────────────────
  # Web frontend: private S3 bucket served via CloudFront with OAC.
  # The deploy script pushes apps/web/dist/ to the bucket and invalidates.
  # ────────────────────────────────────────────────────────────────────
  WebBucket:
    DeletionPolicy: !If [EnableDeletionProtection, Retain, Delete]
    UpdateReplacePolicy: !If [EnableDeletionProtection, Retain, Delete]
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub x-game-web-${Stage}-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub x-game-web-${Stage}

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub x-game-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
        Description: !Sub "OAC for x-game web (${Stage})"

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "x-game web (${Stage})"
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiVpcOrigin
            DomainName: !GetAtt Alb.DNSName
            VpcOriginConfig:
              VpcOriginId: !GetAtt ApiVpcOrigin.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
        CacheBehaviors:
          - PathPattern: "/trpc/*"
            TargetOriginId: ApiVpcOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
          - PathPattern: "/api/*"
            TargetOriginId: ApiVpcOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Stage
          Value: !Ref Stage

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

Outputs:
  Stage:
    Value: !Ref Stage
    Export:
      Name: !Sub x-game-stage-${Stage}

  ApiEndpoint:
    Description: Internal ALB DNS name (the API origin; not directly reachable from the internet - only via CloudFront VPC Origin)
    Value: !GetAtt Alb.DNSName
    Export:
      Name: !Sub x-game-api-endpoint-${Stage}

  PublicUrl:
    Description: Single public entry point - all traffic (web + API) goes through CloudFront
    Value: !Sub "https://${WebDistribution.DomainName}"
    Export:
      Name: !Sub x-game-public-url-${Stage}

  ServerFunctionName:
    Description: Lambda function name
    Value: !Ref ServerFunction
    Export:
      Name: !Sub x-game-server-function-${Stage}

  DatabaseEndpoint:
    Description: RDS instance endpoint (private)
    Value: !GetAtt Database.Endpoint.Address
    Export:
      Name: !Sub x-game-db-endpoint-${Stage}

  DatabaseSecretArn:
    Description: Secrets Manager ARN holding the auto-generated master password
    Value: !GetAtt Database.MasterUserSecret.SecretArn

  WebBucketName:
    Description: S3 bucket for web assets
    Value: !Ref WebBucket
    Export:
      Name: !Sub x-game-web-bucket-${Stage}

  WebDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref WebDistribution
    Export:
      Name: !Sub x-game-web-distribution-${Stage}

  WebUrl:
    Description: Public URL of the web frontend
    Value: !Sub "https://${WebDistribution.DomainName}"
    Export:
      Name: !Sub x-game-web-url-${Stage}