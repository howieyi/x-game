# cfn-lint configuration. Suppresses one false positive:
#
# - E1020 / E6101: RDS `MasterUserSecret.SecretArn` attribute — documented at
#   https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-rds-dbcluster.html#aws-resource-rds-dbcluster-return-values
#   but cfn-lint doesn't yet know about it.
#
# Note: `OriginType: vpc` is NOT a valid CloudFront Distribution.Origin
# property — the origin type is inferred from which of `S3OriginConfig`,
# `CustomOriginConfig`, or `VpcOriginConfig` is set. Don't add it back.
templates:
  - template.yaml
ignore_templates:
  - .aws-sam/**/*
ignore_checks:
  - E1020
  - E6101