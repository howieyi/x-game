# SAM CLI configuration. Switch the default `sam deploy` target by passing
# `--config-env <name>` (e.g. `sam deploy --config-env prod`).
# Each environment knows which stack name + region to target and which
# parameters to surface. Sensitive values (BETTER_AUTH_SECRET, etc.) are
# read from the shell environment so they never end up in this file or in
# the CloudFormation change set in plaintext.
#
# Key layout gotcha: every sam subcommand (deploy, build, …) reads its
# options from `[<env>.<cmd>.parameters]`, NOT from `[<env>.<cmd>]` directly.
# If you put a key under `[default.deploy]`, SAM silently ignores it and
# falls back to flag defaults — which is why `--stack-name` "goes missing"
# even though the file looks correct. The format below is verified against
# aws-sam-cli 1.162.1; `extends = "default"` does NOT inherit across these
# nested parameter tables, so every env duplicates the keys it needs.

version = 0.1

[default.deploy.parameters]
resolve_s3 = true
region = "us-east-1"
stack_name = "x-game-dev"
s3_prefix = "x-game-dev"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
parameter_overrides = [
  "Stage=dev",
  "BetterAuthSecret=$BETTER_AUTH_SECRET",
  "AuroraMinCapacity=0.5",
  "AuroraMaxCapacity=2",
  "LambdaMemoryMb=512",
]
tags = "Project=x-game Stage=dev ManagedBy=sam"
confirm_changeset = true
create_changeset = true
fail_on_empty_changeset = false
use_json = true
on_failure = "ROLLBACK"

[default.build.parameters]
use_container = false
skip_pull_image = true
build_log_file = ".aws-sam/build.log"

[dev.deploy.parameters]
resolve_s3 = true
region = "us-east-1"
stack_name = "x-game-dev"
s3_prefix = "x-game-dev"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
parameter_overrides = [
  "Stage=dev",
  "BetterAuthSecret=$BETTER_AUTH_SECRET",
  "AuroraMinCapacity=0.5",
  "AuroraMaxCapacity=2",
  "LambdaMemoryMb=512",
]
tags = "Project=x-game Stage=dev ManagedBy=sam"
confirm_changeset = true
create_changeset = true
fail_on_empty_changeset = false
use_json = true
on_failure = "ROLLBACK"

[staging.deploy.parameters]
resolve_s3 = true
region = "us-east-1"
stack_name = "x-game-staging"
s3_prefix = "x-game-staging"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
parameter_overrides = [
  "Stage=staging",
  "BetterAuthSecret=$BETTER_AUTH_SECRET",
  "AuroraMinCapacity=0.5",
  "AuroraMaxCapacity=4",
  "LambdaMemoryMb=1024",
]
tags = "Project=x-game Stage=staging ManagedBy=sam"
confirm_changeset = true
create_changeset = true
fail_on_empty_changeset = false
use_json = true
on_failure = "ROLLBACK"

[prod.deploy.parameters]
resolve_s3 = true
region = "us-east-1"
stack_name = "x-game-prod"
s3_prefix = "x-game-prod"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
parameter_overrides = [
  "Stage=prod",
  "BetterAuthSecret=$BETTER_AUTH_SECRET",
  "AuroraMinCapacity=1",
  "AuroraMaxCapacity=8",
  "LambdaMemoryMb=1024",
  "DeletionProtection=true",
]
tags = "Project=x-game Stage=prod ManagedBy=sam"
confirm_changeset = true
create_changeset = true
fail_on_empty_changeset = false
use_json = true
on_failure = "ROLLBACK"
